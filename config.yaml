# Sample DOC MBE pack — the USER-facing agent.
#
# Generated by pack_kit.scaffold from packs/_template/. Everything here is meant
# to be edited: the constructor writes a pack that runs, not a pack that is
# finished.
#
# The `pack:` block is ignored by agent-slapsci (which reads only the agents and
# pool keys) and read by pack-kit. Everything else — which ontology, which memory
# database, what this agent is for — is already expressed where it is used, and
# is not repeated here:
#
#   ontology     -> MEMORY_ONTOLOGY, in the memory tool's env
#   memory db    -> MEMORY_DB, same place
#   description  -> the first paragraph of prompts/lead.md, which agent-slapsci
#                   already turns into the delegate_to_* docstring
#
# READ-ONLY BY CONSTRUCTION. No web group, no ingestion tool, nothing that can
# write to the memory. Scraping and ingesting cost real money and belong to the
# maintainer — see config_admin.yaml, learn.sh, and `python -m pack_kit.serve`.
# `use_pack` only ever loads THIS file, so a user's conversation cannot reach the
# scraper even if the model asks for it.
#
# A pack ships MACHINERY, never a model. The provider/model below are defaults
# meant to be overridden: the host decides which LLM serves this pack, the user's
# own choice first (see pack_kit.llm_policy).

pack:
  version: "0.1.0"
  aliases: [epitaxy, 2d_materials]
  admin_config: config_admin.yaml

  # No `container:` — this pack informs, it does not execute.
  # Not a lack: hpc_infrastructure knows everything about the national
  # machines without running one. To wrap an image, uncomment:
  #
  # container:
  #   registry: "oras://…/my-image.sif"
  #   digest: "sha256:…"   # measured; this is the identity
  #   tag: "latest"        # informational only
  #   code_version: ""


agents:

  sample_doc_mbe_lead:
    provider: cea_mistral
    model: mistralai-medium
    prompt_file: "{here}/prompts/lead.md"
    max_history_messages: 40
    model_params:
      temperature: 0.2
      mixtral_api_url: "https://maia-chat.intra.cea.fr"



    tools:
      builtin: [files, search]
      native:
        # always-on-memory's OWN wrapper, not the copy in tools_for_agent: that
        # one is an older fork which never passed triplet_mode, so every ingest
        # silently fell back to flat binary extraction.
        # `file:` and not `module:`, even when the value below names a module.
        # The two branches differ: `file:` builds a FRESH module object per
        # entry, so this wrapper's capture-at-import of MEMORY_DB / MEMORY_ONTOLOGY
        # / MEMORY_TRIPLET_MODE is per pack. `module:` returns the process-wide
        # singleton, and two packs would share whichever configuration was
        # imported last — a pack answering from another pack's graph.
        #
        # `{module:memory_tools}` asks agent-slapsci to locate an INSTALLED
        # module and then load it by path: no bet on where the code sits on
        # disk. The constructor writes a relative path here instead when
        # always-on-memory is not installed but a checkout sits above this pack.
        - file: "{module:memory_tools}"
          functions: [query_memory]      # read only — see the header
          env:
            MEMORY_DB: "{here}/memory/sample_doc_mbe.db"
            MEMORY_ONTOLOGY: "{here}/ontology/schema.ttl"
            MEMORY_PROVIDER: cea_mistral
            MEMORY_API_URL: "https://maia-chat.intra.cea.fr"
            MEMORY_MODEL: mistralai-small
            MEMORY_EXTRACTION_PASSES: "2"
            # Per pack, decided by the shape of the domain — and it must match
            # config_admin.yaml, or the graph gains two incompatible shapes.
            # nary when a fact ties several things together in one context;
            # binary when facts are naturally pairwise.
            MEMORY_TRIPLET_MODE: nary
            MEMORY_AUTO_CONSOLIDATE: "false"
            MEMORY_COREFERENCE: "false"   # scheduled: ./learn.sh --coreference
            MEMORY_QUERY_MODE: classic
      options:
        show_tool_calls: true
        max_tool_iterations: 30
        workdir: "{here}/sandbox"
        policy:
          default: allow
          deny: [delete_file]


pool:
  entry_agent: sample_doc_mbe_lead
  max_depth: 1
